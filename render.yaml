services:
  - type: web
    name: linkboard-service
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: linkboard-postgres
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
      - key: LOG_LEVEL
        value: info

databases:
  - name: linkboard-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: linkboard
    user: linkboard_user
    # Application traffic uses Render's private network, not a public DB endpoint.
    ipAllowList: []
