name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linkboard
      ADMIN_API_KEY: test-admin-api-key-1234
      IP_HASH_SALT: test-ip-hash-salt-1234
      HOST: 127.0.0.1
      PORT: 3000
      NODE_ENV: test
      LOG_LEVEL: silent
      ALLOW_INTEGRATION_WRITES: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; reads packageManager

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
      - name: Database and compiled-server smoke
        run: pnpm test:integration
      - name: Known credential patterns and history
        run: pnpm security:scan
      - name: Gitleaks history scan
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
      - name: Container build
        run: docker build -t linkboard-ci .
